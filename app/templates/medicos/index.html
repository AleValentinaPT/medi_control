{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2>Lista de Médicos</h2>
        <a href="{{ url_for('bp_medicos.crear') }}" class="btn btn-primary mb-3">Nuevo Médico</a>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Especialidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for medico in medicos %}
                <tr>
                    <td>{{ medico.id }}</td>
                    <td>{{ medico.nombre }}</td>
                    <td>{{ medico.especialidad }}</td>
                    <td>
                        <a href="{{ url_for('bp_medicos.eliminar', id=medico.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
